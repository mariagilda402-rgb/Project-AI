name: Deploy Mobile Web Bundle

on:
  push:
    branches: [ "main", "codex/nexus-command-orchestrator" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile

      - name: Deploy mobile bundle
        id: deployment
        uses: actions/deploy-pages@v4
